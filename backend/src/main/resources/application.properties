spring.datasource.url=jdbc:postgresql://localhost:5432/transport_db
spring.datasource.username=deryadurgun
spring.datasource.password=6572

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Timezone / date-time configuration
# Use Turkey time (Europe/Istanbul) for JSON formatting and JVM default when the app runs.
spring.jackson.time-zone=Europe/Istanbul
spring.jackson.serialization.write-dates-as-timestamps=false

# Tell Hibernate which timezone to use when writing to the database.
# Consider using UTC for DB storage in the long run; for now use Europe/Istanbul per preference.
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul